[package]
name = "chronostrace-proxy"
version.workspace = true
edition.workspace = true

[dependencies]
chronostrace-core = { path = "../chronostrace-core" }
chronostrace-scrub = { path = "../chronostrace-scrub" }
chronostrace-chaos = { path = "../chronostrace-chaos" }
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# HTTP client for record mode (upstream forwarding, including HTTPS).
# No env proxies are used: the client connects directly, so local and
# dev upstreams work without proxy configuration.
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
