name: Release & Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build all artifacts without publishing to PyPI or npm"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 1. Cross-Compile Native CLI Binaries Across 5 Architectures
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_zigbuild: true
            archive_ext: tar.gz
            bin_name: chronostrace
            npm_dir: cli-linux-x64-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_zigbuild: true
            archive_ext: tar.gz
            bin_name: chronostrace
            npm_dir: cli-linux-arm64-musl
          - target: x86_64-apple-darwin
            os: macos-13
            use_zigbuild: false
            archive_ext: tar.gz
            bin_name: chronostrace
            npm_dir: cli-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-14




            use_zigbuild: false
            archive_ext: tar.gz
            bin_name: chronostrace
            npm_dir: cli-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_zigbuild: false
            archive_ext: zip
            bin_name: chronostrace.exe
            npm_dir: cli-win32-x64-msvc

    steps:
       - name: Checkout repository
         uses: actions/checkout@v4

       - name: Install Rust stable toolchain for ${{ matrix.target }}
         uses: dtolnay/rust-toolchain@stable
         with:
           targets: ${{ matrix.target }}

       - name: Cache Cargo build artifacts
         uses: Swatinem/rust-cache@v2
         with:
           key: ${{ matrix.target }}

       - name: Install Zig and cargo-zigbuild (Linux musl targets)
         if: matrix.use_zigbuild
         uses: goto-bus-stop/setup-zig@v2
         with:
           version: 0.13.0

       - name: Install cargo-zigbuild crate
         if: matrix.use_zigbuild
         run: cargo install --locked cargo-zigbuild

       - name: Compile chronostrace-cli (zigbuild)
         if: matrix.use_zigbuild
         run: cargo zigbuild --release --package chronostrace-cli --target ${{ matrix.target }}

       - name: Compile chronostrace-cli (native cargo)
         if: ${{ !matrix.use_zigbuild }}
         run: cargo build --release --package chronostrace-cli --target ${{ matrix.target }}

       - name: Package release archive (Unix .tar.gz)
         if: runner.os != 'Windows'
         shell: bash
         run: |
           mkdir -p dist
           cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" dist/
           cp LICENSE README.md dist/
           ARCHIVE_NAME="chronostrace-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
           tar -C dist -czf "${ARCHIVE_NAME}" "${{ matrix.bin_name }}" LICENSE README.md
           shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

       - name: Package release archive (Windows .zip)
         if: runner.os == 'Windows'
         shell: pwsh
         run: |
           New-Item -ItemType Directory -Force -Path dist
           Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -Destination dist/
           Copy-Item LICENSE, README.md -Destination dist/
           $ArchiveName = "chronostrace-${{ github.ref_name }}-${{ matrix.target }}.zip"
           Compress-Archive -Path "dist\*" -DestinationPath $ArchiveName
           $Hash = (Get-FileHash -Algorithm SHA256 $ArchiveName).Hash.ToLower()
           "$Hash $ArchiveName" | Out-File -Encoding ascii "$ArchiveName.sha256"

       - name: Attest SLSA build provenance for binary archive
         uses: actions/attest-build-provenance@v1
         with:
           subject-path: "chronostrace-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}"

       - name: Upload release archive & checksum
         uses: actions/upload-artifact@v4
         with:
           name: release-archive-${{ matrix.target }}
           path: |
             chronostrace-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}
             chronostrace-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256






       - name: Upload raw binary for npm platform staging
         uses: actions/upload-artifact@v4
         with:
           name: raw-bin-${{ matrix.npm_dir }}
           path: target/${{ matrix.target }}/release/${{ matrix.bin_name }}

   # ---------------------------------------------------------------------------
   # 2. Publish GitHub Release with Aggregated SHA256SUMS
   # ---------------------------------------------------------------------------
  publish-github-release:
    name: Create GitHub Release
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
           pattern: release-archive-*
           path: release-assets
           merge-multiple: true

      - name: Generate unified SHA256SUMS manifest
        working-directory: release-assets
        run: |
          cat *.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.sha256
            release-assets/SHA256SUMS

  # ---------------------------------------------------------------------------
  # 3. Build Multi-Platform Python Wheels (maturin) & Publish to PyPI
  # ---------------------------------------------------------------------------
  build-python-wheels:
    name: Build Python Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
           - os: ubuntu-latest
             target: x86_64
             manylinux: "2_28"
           - os: ubuntu-latest
             target: aarch64
             manylinux: "2_28"
           - os: macos-13
             target: x86_64
             manylinux: ""
           - os: macos-14
             target: aarch64
             manylinux: ""
           - os: windows-latest
             target: x64
             manylinux: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel embedding chronostrace binary via maturin
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          working-directory: sdks/python
          args: --release --out dist
          sccache: "true"





          manylinux: ${{ matrix.manylinux }}

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: sdks/python/dist/*.whl

  publish-pypi:
    name: Publish to PyPI (OIDC Trusted Publisher)
    needs: [build-python-wheels]
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytest-chronostrace
    steps:
      - name: Download all built wheels
        uses: actions/download-artifact@v4
        with:
           pattern: python-wheels-*
           path: dist
           merge-multiple: true

      - name: Publish wheels to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true

  # ---------------------------------------------------------------------------
  # 4. Stage Platform Binaries & Publish @chronostrace/test to npm
  # ---------------------------------------------------------------------------
  publish-npm:
    name: Publish @chronostrace/test to npm
    needs: [build-binaries]
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@chronostrace/test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 with npm registry auth
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Download all raw platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: raw-bin-*
          path: npm-binaries

      - name: Stage and publish platform binary packages + root SDK package
        working-directory: sdks/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          CLEAN_VERSION="${RELEASE_VERSION#v}"

              # Publish each platform-specific binary package
              for PLATFORM_DIR in ../../npm-binaries/raw-bin-*; do
                PKG_SUFFIX="${PLATFORM_DIR##*raw-bin-}"
                mkdir -p "npm-platforms/${PKG_SUFFIX}/bin"
                cp "${PLATFORM_DIR}"/* "npm-platforms/${PKG_SUFFIX}/bin/"
                chmod +x "npm-platforms/${PKG_SUFFIX}/bin/"* || true

                node -e '
                  const fs = require("fs");
                  const suffix = process.argv[1];
                  const version = process.argv[2];
                  const [_, osName, cpuArch, libc] = suffix.split("-");
                  const pkg = {
                    name: `@chronostrace/${suffix}`,





                    version,
                    description: `Native ChronosTrace binary for ${suffix}`,
                    license: "Apache-2.0",
                    repository: {
                       type: "git",
                       url: "git+https://github.com/AHMADYAZIDALFARISI/ChronosTrace.git"
                    },
                    os: [osName],
                    cpu: [cpuArch],
                    ...(libc === "musl" ? { libc: ["musl"] } : {}),
                    files: ["bin"]
                  };
                  fs.writeFileSync(`npm-platforms/${suffix}/package.json`, JSON.stringify(pkg, null, 2));
                ' "${PKG_SUFFIX}" "${CLEAN_VERSION}"

                (cd "npm-platforms/${PKG_SUFFIX}" && npm publish --access public --provenance)
              done

              # Sync root @chronostrace/test version and publish with provenance
              npm version "${CLEAN_VERSION}" --no-git-tag-version
              npm ci
              npm run build
              npm publish --access public --provenance
