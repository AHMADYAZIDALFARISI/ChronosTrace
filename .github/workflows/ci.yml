name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 1. Static Analysis, Formatting & Supply-Chain Security Audit
  # ---------------------------------------------------------------------------
  lint-and-audit:
    name: Rust Fmt, Clippy & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy across all workspace targets
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run cargo-audit for vulnerability scanning
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate .ctrace JSON Schema syntax
        run: |
          python3 -c "import json; json.load(open('schemas/ctrace-v1.schema.json'))"

  # ---------------------------------------------------------------------------
  # 2. Cross-Platform Rust Workspace Unit & Integration Tests
  # ---------------------------------------------------------------------------
  rust-test-matrix:





    name: Rust Workspace Tests (${{ matrix.os }})
    needs: lint-and-audit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo workspace unit and integration tests
        run: cargo test --workspace --all-features -- --nocapture

      - name: Build release CLI binary for E2E verification
        run: cargo build --release --package chronostrace-cli

      - name: Upload built CLI binary for downstream SDK jobs
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: chronostrace-linux-x64-bin
          path: target/release/chronostrace
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 3. Python SDK (pytest-chronostrace) End-to-End Integration Suite
  # ---------------------------------------------------------------------------
  sdk-python-e2e:
    name: Python SDK E2E (Python ${{ matrix.python-version }})
    needs: rust-test-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download compiled ChronosTrace CLI binary
        uses: actions/download-artifact@v4
        with:
          name: chronostrace-linux-x64-bin
          path: /usr/local/bin

      - name: Make ChronosTrace binary executable
        run: |
          chmod +x /usr/local/bin/chronostrace
          chronostrace --version

      - name: Install pytest-chronostrace plugin in editable mode
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run pytest-chronostrace integration tests
        working-directory: sdks/python
        run: pytest -v

  # ---------------------------------------------------------------------------
  # 4. TypeScript SDK (@chronostrace/test) End-to-End Integration Suite
  # ---------------------------------------------------------------------------
  sdk-typescript-e2e:
    name: TypeScript SDK E2E (Node ${{ matrix.node-version }})
    needs: rust-test-matrix
    runs-on: ubuntu-latest





    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download compiled ChronosTrace CLI binary
        uses: actions/download-artifact@v4
        with:
          name: chronostrace-linux-x64-bin
          path: /usr/local/bin

      - name: Make ChronosTrace binary executable
        run: chmod +x /usr/local/bin/chronostrace

      - name: Install dependencies, typecheck, and run Vitest E2E suite
        working-directory: sdks/typescript
        env:
          CHRONOSTRACE_BIN_PATH: /usr/local/bin/chronostrace
        run: |
          npm ci
          npm run typecheck
          npm test

  # ---------------------------------------------------------------------------
  # 5. Dogfood Self-Test: MCP Stdio Replay & Trajectory Diff Summary
  # ---------------------------------------------------------------------------
  dogfood-self-test:
    name: Dogfood MCP Wrap & Trajectory Diff
    needs: rust-test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled ChronosTrace CLI binary
        uses: actions/download-artifact@v4
        with:
          name: chronostrace-linux-x64-bin
          path: /usr/local/bin

      - name: Make binary executable
        run: chmod +x /usr/local/bin/chronostrace

      - name: Generate synthetic baseline & candidate cassettes and verify diff
        run: |
          mkdir -p /tmp/ctrace-dogfood
          cat << 'EOF' > /tmp/ctrace-dogfood/baseline.ctrace
          version: "1.0"
          cassette_id: "refund_agent_baseline"
          metadata:
            created_at: "2026-11-01T00:00:00Z"
            similarity_threshold: 0.85
            scrubbed: true
          nodes:
            - node_id: "node_0001_a1b2c3d4"
               parent_id: null
               kind: McpToolCall
               exact_request_hash: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
               prompt_simhash: "8f4e2a1b9c0d3e7f"
               structural_tool_hash: "4b227777d4dd1fc61c6f884f48641d02b4d121d3fd328cb08b5531fcacdabf8a"
               request_payload:
                 jsonrpc: "2.0"
                 method: "tools/call"
                 params:
                   name: "verify_order"
                   arguments:
                     order_id: "ORD-900"
               response_payload:
                 result:
                   content:
                     - type: "text"





                            text: "{\"valid\": true, \"refundable_amount\": 50.0}"
                    recorded_latency_ms: 14
              EOF

              cp /tmp/ctrace-dogfood/baseline.ctrace /tmp/ctrace-dogfood/candidate.ctrace

              chronostrace verify --cassette /tmp/ctrace-dogfood/baseline.ctrace
              chronostrace diff /tmp/ctrace-dogfood/baseline.ctrace /tmp/ctrace-dogfood/candidate.ctrace --format markdown

              # Test MCP stdio offline replay via stdin pipe
              echo '{"jsonrpc":"2.0","id":42,"method":"tools/call","params":{"name":"verify_order","arguments":{"order_i
                | chronostrace mcp-wrap --mode replay --cassette /tmp/ctrace-dogfood/baseline.ctrace \
                | grep -q '"id":42'
