name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-and-audit:
    name: Rust Fmt, Clippy & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy across all workspace targets
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Validate .ctrace JSON Schema and test fixture
        run: |
          python3 -m pip install jsonschema
          python3 -c '
          import json, jsonschema
          schema = json.load(open("schemas/ctrace-v1.schema.json"))
          sample = {
            "version": "1.0",
            "cassette_id": "ci_schema_check",
            "metadata": {
              "created_at": "2026-11-01T12:00:00Z",
              "similarity_threshold": 0.85,
              "scrubbed": True,
              "scrubber_policy_version": "1.1.0-entropy-regex",
              "redaction_count": 0
            },
            "nodes": [{
              "node_id": "node_0001_a1b2c3d4",
              "parent_id": None,
              "kind": "McpToolCall",
              "exact_request_hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855",
              "prompt_simhash": "8f4e2a1b9c0d3e7f",
              "structural_tool_hash": "4b227777d4dd1fc61c6f884f48641d02b4d121d3fd328cb08b5531fcacdabf8a",
              "safety_critical_hash": "4b227777d4dd1fc61c6f884f48641d02b4d121d3fd328cb08b5531fcacdabf8a",
              "request_payload": {"jsonrpc": "2.0", "method": "tools/call"},
              "response_payload": {"result": {"ok": True}},
              "recorded_latency_ms": 10
            }]
          }
          jsonschema.validate(instance=sample, schema=schema)
          '

  rust-test-matrix:
    name: Rust Workspace Tests (${{ matrix.os }})
    needs: lint-and-audit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo workspace unit and integration tests
        run: cargo test --workspace --all-features -- --nocapture

      - name: Build release CLI binary for E2E verification
        run: cargo build --release --package chronostrace-cli

      - name: Upload built CLI binary for downstream SDK jobs
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: chronostrace-linux-x64-bin
          path: target/release/chronostrace
          retention-days: 1

  sdk-python-e2e:
    name: Python SDK E2E (Python ${{ matrix.python-version }})
    needs: rust-test-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download compiled ChronosTrace CLI binary
        uses: actions/download-artifact@v4
        with:
          name: chronostrace-linux-x64-bin
          path: /usr/local/bin

      - name: Make ChronosTrace binary executable
        run: |
          chmod +x /usr/local/bin/chronostrace
          chronostrace --version

      - name: Compile and test pytest-chronostrace plugin
        working-directory: sdks/python
        run: |
          python -m py_compile pytest_chronostrace/plugin.py
          python -m pip install --upgrade pip pytest
          pytest -v

  sdk-typescript-e2e:
    name: TypeScript SDK E2E (Node ${{ matrix.node-version }})
    needs: rust-test-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download compiled ChronosTrace CLI binary
        uses: actions/download-artifact@v4
        with:
          name: chronostrace-linux-x64-bin
          path: /usr/local/bin

      - name: Make ChronosTrace binary executable
        run: chmod +x /usr/local/bin/chronostrace

      - name: Install dependencies, typecheck, and run Vitest E2E suite
        working-directory: sdks/typescript
        env:
          CHRONOSTRACE_BIN_PATH: /usr/local/bin/chronostrace
        run: |
          npm install
          npm run typecheck
          npm test