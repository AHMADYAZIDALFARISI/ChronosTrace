[workspace]
resolver = "2"
members = [
    "crates/chronostrace-core",
    "crates/chronostrace-scrub",
    "crates/chronostrace-chaos",
    "crates/chronostrace-proxy",
    "crates/chronostrace-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AHMADYAZIDALFARISI/ChronosTrace"
# SECOND AUDIT P1: MSRV raised from 1.78 to 1.88. The 1.78 claim
# was never verified and is false against the current lockfile:
# clap 4.6.7 / clap_lex 1.1.1 require edition2024 (Cargo >= 1.85),
# and encoding_rs 0.8.44 / icu_* 2.4.0 (via reqwest -> idna)
# require rustc >= 1.88. Verified: `cargo +1.78` fails at manifest
# parse, `cargo +1.85` fails on rustc-version gates, and the full
# workspace suite passes on `cargo +1.88`. See docs/compatibility.md.
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
regex = "1.10"
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }